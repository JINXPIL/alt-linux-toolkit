# =============================================================================
# /etc/altctl.conf — все настройки altctl в одном месте (синтаксис bash).
# Любой параметр можно временно переопределить окружением:
#   sudo BRANCH=p11 altctl repo auto
# =============================================================================

# --- Источники пакетов -------------------------------------------------------
# auto — определить ветку по системе (рекомендуется); или Sisyphus, p10, p11 ...
BRANCH=auto

# Зеркала по приоритету: базовый URL, внутри которого лежат Sisyphus/, p10/, p11/.
# Схема — лишь подсказка: при REPO_HTTPS=auto для каждого зеркала сначала
# пробуется https://, затем http://.
MIRRORS="https://mirror.yandex.ru/altlinux
         https://mirror.truenetwork.ru/altlinux
         http://ftp.altlinux.org/pub/distributions/ALTLinux"

# auto — HTTPS в приоритете, HTTP только при проблемах с TLS/сертификатом;
# yes — только HTTPS; no — только HTTP. Нужен пакет apt-https (altctl ставит сам).
REPO_HTTPS=auto

# fastest — самое быстрое из доступных; first — первое доступное по списку
MIRROR_SELECT=fastest
MIRROR_TIMEOUT=8

# 32-битные библиотеки (x86_64-i586) — нужны для Wine, Steam и т. п.
REPO_MULTILIB=no

# Сетевая устойчивость APT: /etc/apt/apt.conf.d/99altctl-network.conf (altctl repo tune)
APT_NET_TUNING=yes
APT_PIPELINE_DEPTH=0      # 0 — без конвейера запросов (рвётся на DPI, прокси, мостах ВМ)
APT_TIMEOUT=30            # секунд без данных до разрыва и повтора
APT_RETRIES=3             # повторы неудачной загрузки файла

# --- Профиль среды (altctl profile) -----------------------------------------
# auto — определять автоматически:
#   vm      — в виртуальной машине: без сна и гашения экрана, «агрессивный» chrony,
#             синхронизация часов с хостом, проверка часов каждые CLOCK_WATCH_INTERVAL
#   server  — без графики: без сна и гашения консоли
#   desktop — рабочая станция: энергосбережение не трогается
PROFILE=auto

# --- Время (altctl time) -----------------------------------------------------
TIME_SYNC=yes             # управлять chrony: установка, запуск, шаг часов, запись в RTC
TIME_MAX_OFFSET=2         # допустимое расхождение часов, секунд; больше — коррекция
TIME_SYNC_WAIT=20         # сколько секунд ждать ответа NTP-серверов
TIME_HTTP_FALLBACK=yes    # если UDP 123 закрыт — выставить время по заголовку Date зеркала
NTP_SERVERS=""            # свои серверы в дополнение к chrony.conf: "ntp1.vniiftri.ru ru.pool.ntp.org"
VM_GUEST_TOOLS=yes        # в ВМ ставить гостевые инструменты (VirtualBox/VMware/QEMU/Hyper-V)
CLOCK_WATCH_INTERVAL=2min # профиль vm: как часто проверять часы (altctl time check)

# --- Гостевые дополнения (altctl guest) --------------------------------------
# Кого добавлять в группу vboxsf (доступ к общим папкам VirtualBox):
# auto — все обычные пользователи (UID_MIN..UID_MAX из /etc/login.defs; в ALT
# это обычно с 500) и вошедшие в систему; или список: "user student"
GUEST_USERS=auto
GUEST_VBOXCLIENT=yes      # автозапуск VBoxClient: буфер обмена, экран, drag-and-drop

# --- Обновление --------------------------------------------------------------
UPDATE_KERNEL=yes         # update-kernel: новое ядро + модули к нему
REMOVE_OLD_KERNELS=yes    # удалять старые ядра, но только после загрузки в новое
UPDATE_FLATPAK=yes        # обновлять flatpak-приложения (если flatpak установлен)
CLEAN_CACHE=yes           # apt-get clean после обновления
AUTO_REBOOT=no            # перезагружаться самому после установки нового ядра
REBOOT_DELAY_MIN=5

# --- Самовосстановление ------------------------------------------------------
LOCK_WAIT=300             # сколько секунд ждать занятый APT (Synaptic, Центр приложений)
WATCH_UNITS="sshd"        # службы, которые altctl fix/maintain всегда поднимает
ROOT_MIN_FREE_MB=1024
BOOT_MIN_FREE_MB=150

# --- Службы (altctl services) ------------------------------------------------
# «пакет[|альтернатива]:служба[,служба]». Службу можно не указывать —
# altctl возьмёт все службы из файлов пакета.
SERVICES="openssh-server:sshd"
# Пример веб- и файлового сервера:
# SERVICES="openssh-server:sshd apache2-base|apache2:httpd2 samba:smb,nmb"

# --- Межсетевой экран (altctl firewall apply) --------------------------------
FW_ENABLE=no              # yes — fix/maintain следят, чтобы правила были загружены
FW_TCP_PORTS="22"         # через пробел; диапазон: 6000-6010
FW_UDP_PORTS=""
FW_ALLOW_PING=yes
FW_TRUSTED_NETS=""        # подсети с полным доступом: "192.168.1.0/24 fd00::/8"
FW_IPV6=yes               # те же правила для IPv6 (ICMPv6 разрешается всегда)
FW_FORWARD=DROP           # ACCEPT — если машина маршрутизатор/хост для ВМ
FW_LOG_DROPS=yes          # журнал: journalctl -k | grep altctl-drop
FW_FORCE=no               # yes — применять, даже если есть цепочки Docker/libvirt

# --- Расписание (altctl timer on) --------------------------------------------
# Формат systemd: "daily", "weekly", "Sun 03:00", "*-*-* 04:00"
TIMER_SCHEDULE="*-*-* 04:00"
