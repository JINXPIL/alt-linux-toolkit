# =============================================================================
# /etc/altctl.conf — все настройки altctl в одном месте (синтаксис bash).
# Любой параметр можно временно переопределить окружением:
#   sudo BRANCH=p11 altctl repo auto
# =============================================================================

# --- Источники пакетов -------------------------------------------------------
# auto — определить ветку по системе (рекомендуется); или Sisyphus, p10, p11 ...
BRANCH=auto

# Зеркала по приоритету: базовый URL, внутри которого лежат Sisyphus/, p10/, p11/
MIRRORS="http://mirror.truenetwork.ru/altlinux
         http://mirror.yandex.ru/altlinux
         http://ftp.altlinux.org/pub/distributions/ALTLinux"

# fastest — самое быстрое из доступных; first — первое доступное по списку
MIRROR_SELECT=fastest
MIRROR_TIMEOUT=8

# 32-битные библиотеки (x86_64-i586) — нужны для Wine, Steam и т. п.
REPO_MULTILIB=no

# --- Обновление --------------------------------------------------------------
UPDATE_KERNEL=yes         # update-kernel: новое ядро + модули к нему
REMOVE_OLD_KERNELS=yes    # удалять старые ядра, но только после загрузки в новое
UPDATE_FLATPAK=yes        # обновлять flatpak-приложения (если flatpak установлен)
CLEAN_CACHE=yes           # apt-get clean после обновления
AUTO_REBOOT=no            # перезагружаться самому после установки нового ядра
REBOOT_DELAY_MIN=5

# --- Самовосстановление ------------------------------------------------------
LOCK_WAIT=300             # сколько секунд ждать занятый APT (Synaptic, Центр приложений)
WATCH_UNITS="sshd"        # службы, которые altctl fix/maintain всегда поднимает
ROOT_MIN_FREE_MB=1024
BOOT_MIN_FREE_MB=150

# --- Службы (altctl services) ------------------------------------------------
# «пакет[|альтернатива]:служба[,служба]». Службу можно не указывать —
# altctl возьмёт все службы из файлов пакета.
SERVICES="openssh-server:sshd"
# Пример веб- и файлового сервера:
# SERVICES="openssh-server:sshd apache2-base|apache2:httpd2 samba:smb,nmb"

# --- Межсетевой экран (altctl firewall apply) --------------------------------
FW_ENABLE=no              # yes — fix/maintain следят, чтобы правила были загружены
FW_TCP_PORTS="22"         # через пробел; диапазон: 6000-6010
FW_UDP_PORTS=""
FW_ALLOW_PING=yes
FW_TRUSTED_NETS=""        # подсети с полным доступом: "192.168.1.0/24 fd00::/8"
FW_IPV6=yes               # те же правила для IPv6 (ICMPv6 разрешается всегда)
FW_FORWARD=DROP           # ACCEPT — если машина маршрутизатор/хост для ВМ
FW_LOG_DROPS=yes          # журнал: journalctl -k | grep altctl-drop
FW_FORCE=no               # yes — применять, даже если есть цепочки Docker/libvirt

# --- Расписание (altctl timer on) --------------------------------------------
# Формат systemd: "daily", "weekly", "Sun 03:00", "*-*-* 04:00"
TIMER_SCHEDULE="*-*-* 04:00"
